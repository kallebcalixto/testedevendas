<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin – Programação Individual</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzzQg4fMWQm82aOu2xM2huVPvHeyitFxQ",
    authDomain: "controle-remoto-da345.firebaseapp.com",
    databaseURL: "https://controle-remoto-da345-default-rtdb.firebaseio.com",
    projectId: "controle-remoto-da345",
    storageBucket: "controle-remoto-da345.firebasestorage.app",
    messagingSenderId: "246457543992",
    appId: "1:246457543992:web:41bf1bd64a4788fb2625cd",
    measurementId: "G-CFHSFG82SX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let blocosRef = null;

  setPersistence(auth, browserLocalPersistence)
    .then(() => {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          blocosRef = ref(db, `usuarios/${user.uid}/player_m3u`);
          onValue(blocosRef, snap => atualizarLista(snap.val()));
          console.log("Admin conectado à pasta: " + user.uid);
        } else {
          alert("Acesso negado. Faça login no Player primeiro.");
          window.location.href = "cara.html"; 
        }
      });
    })
    .catch((error) => {
      console.error("Erro ao configurar persistência de login:", error);
    });

  function atualizarLista(dados) {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    const diasSemana = ["segunda", "terca", "quarta", "quinta", "sexta", "sabado", "domingo"];

    Object.keys(dados || {}).forEach(i => {
      const b = dados[i];
      const diasSelecionados = b.dias || []; 
      
      const card = document.createElement("div");
      card.className = "card";
      
      let diasHTML = '<div class="dias-check">';
      diasSemana.forEach(dia => {
        const checked = diasSelecionados.includes(dia) ? "checked" : "";
        diasHTML += `
          <label style="display:block; font-size:12px;">
            <input type="checkbox" class="dia-${i}" value="${dia}" ${checked}> ${dia.charAt(0).toUpperCase() + dia.slice(1)}
          </label>`;
      });
      diasHTML += '</div>';

      card.innerHTML = `
        <h3>${b.nome ? b.nome : 'Bloco ' + i}</h3>
        
        <label>Nome de identificação:</label>
        <input id="nome-${i}" value="${b.nome || ''}" placeholder="Ex: Programação da Manhã">

        <label>Link M3U:</label>
        <input id="m3u-${i}" value="${b.m3u || ''}">
        
        <label>Link YouTube:</label>
        <input id="yt-${i}" value="${b.yt || ''}">
        
        <hr style="border-color:#444; margin: 12px 0;">
        <label style="color: #4CAF50; font-weight: bold;">Vídeos do Firebase Storage (Ordem de Reprodução):</label>
        <div id="storage-container-${i}" class="storage-container"></div>
        <button type="button" class="addStorageBtn" onclick="adicionarCampoStorage(${i})">+ Adicionar Vídeo do Storage</button>
        <hr style="border-color:#444; margin: 12px 0;">

        <label>Dias da semana:</label>
        ${diasHTML}

        <hr style="border-color:#444; margin: 12px 0;">
        <label style="color: #17a2b8; font-weight: bold;">Horários Programados (Múltiplos):</label>
        <div id="horarios-container-${i}" class="horarios-container"></div>
        <button type="button" class="addHorarioBtn" onclick="adicionarCampoHorario(${i})">+ Adicionar Horário</button>
        <hr style="border-color:#444; margin: 12px 0;">
        
        <button class="saveBtn" onclick="salvar(${i})">Salvar</button>
        <button class="deleteBtn" onclick="apagar(${i})">Apagar</button>
      `;
      lista.appendChild(card);

      // Preenche os storages já salvos
      const storageArray = Array.isArray(b.storage) ? b.storage : [];
      storageArray.forEach(link => {
        adicionarCampoStorage(i, link);
      });

      // Preenche os horários já salvos (compatibilidade com formato antigo `inicio`/`fim` e novo array `horarios`)
      let horariosArray = [];
      if (Array.isArray(b.horarios) && b.horarios.length > 0) {
        horariosArray = b.horarios;
      } else if (b.inicio || b.fim) {
        horariosArray = [{ inicio: b.inicio || "00:00:00", fim: b.fim || "00:00:00" }];
      } else {
        horariosArray = [{ inicio: "00:00:00", fim: "00:00:00" }];
      }

      horariosArray.forEach(h => {
        adicionarCampoHorario(i, h.inicio, h.fim);
      });
    });
  }

  // Função para gerenciar os inputs dinâmicos de Storage
  window.adicionarCampoStorage = function(i, valor = "") {
    const container = document.getElementById(`storage-container-${i}`);
    if (!container) return;

    const div = document.createElement("div");
    div.className = "storage-item";
    div.style.display = "flex";
    div.style.gap = "5px";
    div.style.marginBottom = "5px";

    const input = document.createElement("input");
    input.type = "text";
    input.className = `storage-input-${i}`;
    input.value = valor;
    input.placeholder = "Cole o link do Storage aqui...";
    input.style.flex = "1";

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.textContent = "X";
    removeBtn.style.width = "35px";
    removeBtn.style.background = "#dc3545";
    removeBtn.style.margin = "0";
    removeBtn.onclick = function() {
      div.remove();
    };

    div.appendChild(input);
    div.appendChild(removeBtn);
    container.appendChild(div);
  };

  // Função para gerenciar os inputs dinâmicos de Horários (Início e Fim)
  window.adicionarCampoHorario = function(i, inicioVal = "00:00:00", fimVal = "00:00:00") {
    const container = document.getElementById(`horarios-container-${i}`);
    if (!container) return;

    const div = document.createElement("div");
    div.className = "horario-item";
    div.style.display = "flex";
    div.style.gap = "5px";
    div.style.marginBottom = "5px";
    div.style.alignItems = "center";

    const spanInicio = document.createElement("span");
    spanInicio.textContent = "De:";
    spanInicio.style.fontSize = "11px";

    const inputInicio = document.createElement("input");
    inputInicio.type = "time";
    inputInicio.step = "1";
    inputInicio.className = `horario-inicio-${i}`;
    inputInicio.value = inicioVal;
    inputInicio.style.width = "110px";

    const spanFim = document.createElement("span");
    spanFim.textContent = "Até:";
    spanFim.style.fontSize = "11px";

    const inputFim = document.createElement("input");
    inputFim.type = "time";
    inputFim.step = "1";
    inputFim.className = `horario-fim-${i}`;
    inputFim.value = fimVal;
    inputFim.style.width = "110px";

    const removeBtn = document.createElement("button");
    removeBtn.type = "button";
    removeBtn.textContent = "X";
    removeBtn.style.width = "35px";
    removeBtn.style.background = "#dc3545";
    removeBtn.style.margin = "0";
    removeBtn.onclick = function() {
      div.remove();
    };

    div.appendChild(spanInicio);
    div.appendChild(inputInicio);
    div.appendChild(spanFim);
    div.appendChild(inputFim);
    div.appendChild(removeBtn);
    container.appendChild(div);
  };

  window.salvar = function(i) {
    if(!auth.currentUser) return;
    
    const checkboxes = document.querySelectorAll(`.dia-${i}:checked`);
    const diasMarcados = Array.from(checkboxes).map(cb => cb.value);

    // Coleta todos os storages
    const storageInputs = document.querySelectorAll(`.storage-input-${i}`);
    const storageArray = Array.from(storageInputs).map(input => input.value.trim()).filter(v => v !== "");

    // Coleta todos os pares de horários (Início e Fim)
    const inicioInputs = document.querySelectorAll(`.horario-inicio-${i}`);
    const fimInputs = document.querySelectorAll(`.horario-fim-${i}`);
    let horariosArray = [];
    for (let j = 0; j < inicioInputs.length; j++) {
      horariosArray.push({
        inicio: inicioInputs[j].value || "00:00:00",
        fim: fimInputs[j].value || "00:00:00"
      });
    }

    const caminho = ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${i}`);
    set(caminho, {
      nome: document.getElementById("nome-" + i).value,
      m3u: document.getElementById("m3u-" + i).value,
      yt: document.getElementById("yt-" + i).value,
      storage: storageArray,
      dias: diasMarcados,
      horarios: horariosArray, // Salvando a lista de horários múltiplos
      inicio: horariosArray.length > 0 ? horariosArray[0].inicio : "00:00:00", // Retrocompatibilidade
      fim: horariosArray.length > 0 ? horariosArray[0].fim : "00:00:00", // Retrocompatibilidade
      timestamp: Date.now()
    });
    alert("✔ Salvo com múltiplos horários e vídeos do Storage!");
  };

  window.apagar = function(i) {
    if (!confirm("Apagar bloco?")) return;
    remove(ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${i}`));
  };

  window.adicionarBloco = function() {
    onValue(blocosRef, snap => {
      const dados = snap.val() || {};
      const chaves = Object.keys(dados).map(Number);
      const novoID = chaves.length > 0 ? Math.max(...chaves) + 1 : 0;
      
      set(ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${novoID}`), {
        nome: "", m3u: "", yt: "", storage: [], dias: [], horarios: [{inicio: "00:00:00", fim: "00:00:00"}], inicio: "00:00:00", fim: "00:00:00", timestamp: Date.now()
      });
    }, { onlyOnce: true });
  };
</script>

<style>
body { background:#111; color:#fff; font-family:Arial; padding: 20px; margin: 0; }
#topBar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
#addBtn { background:#28a745; padding:10px 18px; border:none; color:white; border-radius:8px; cursor:pointer; font-weight: bold; }

#lista {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card { background:#1b1b1b; padding:15px; border-radius:10px; border:1px solid #333; width:360px; box-sizing: border-box; }

input, select { width:100%; margin-bottom:8px; padding:6px; background:#222; border:1px solid #555; color:white; box-sizing: border-box;}
button { width:100%; padding:8px; border:none; color:white; border-radius:6px; margin-top:6px; cursor:pointer; font-weight: bold; }
.saveBtn { background:#007bff; }
.deleteBtn { background:#dc3545; }
.addStorageBtn { background: #17a2b8; margin-bottom: 8px; }
.addHorarioBtn { background: #28a745; margin-bottom: 8px; }
h3 { margin-top: 0; color: #aaa; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; }

.dias-check { 
  background: #222; 
  padding: 10px; 
  border-radius: 5px; 
  margin-bottom: 10px; 
  border: 1px solid #444;
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.dias-check input { width: auto; margin-right: 5px; cursor: pointer; }
</style>
</head>
<body>
<div id="topBar">
  <h1>Admin Individual</h1>
  <button id="addBtn" onclick="adicionarBloco()">+ Novo Bloco Individual</button>
</div>
<div id="lista">Carregando seus blocos…</div>
</body>
</html>
