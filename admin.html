<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Painel Admin — KBS TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: dark; --primary: #2e7d32; --bg: #121212; --card: #1e1e1e; }
  body { background: var(--bg); color: #eee; font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 20px; }
  .wrap { max-width: 900px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-bottom: 20px; }
  header h1 { margin: 0; font-size: 20px; color: var(--primary); }
  .bloco-admin { background: var(--card); border: 1px solid #333; border-radius: 10px; padding: 15px; margin-bottom: 15px; position: relative; }
  .bloco-admin h3 { margin-top: 0; font-size: 16px; color: #ffd700; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  label { font-size: 13px; color: #aaa; }
  input[type="text"], input[type="time"] { background: #000; border: 1px solid #444; color: #fff; padding: 6px 10px; border-radius: 5px; font-size: 14px; }
  input[type="text"] { flex-grow: 1; }
  button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; background: #2f2f2f; color: #fff; font-weight: bold; }
  button:hover { background: #454545; }
  .btn-pri { background: var(--primary); } .btn-pri:hover { background: #3e8d42; }
  .btn-del { background: #b71c1c; } .btn-del:hover { background: #d32f2f; }
  .dias-grid { display: flex; gap: 10px; flex-wrap: wrap; background: #111; padding: 8px; border-radius: 6px; margin-top: 5px; }
  .dias-grid label { font-size: 12px; cursor: pointer; color: #fff; display: flex; align-items: center; gap: 4px; }
  .link-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  
  #telaLoginAdmin {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.95); display: flex; justify-content: center; align-items: center; z-index: 9999;
  }
  .card-login { background: var(--card); padding: 30px; border-radius: 12px; border: 1px solid #333; width: 320px; text-align: center; }
  .card-login input { width: 100%; padding: 10px; margin: 15px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; text-align: center; }
</style>
</head>
<body>

  <!-- Tela de Login do Admin -->
  <div id="telaLoginAdmin">
    <div class="card-login">
      <h2>Painel Admin</h2>
      <p style="font-size: 13px; color: #888;">Digite a senha de acesso</p>
      <input type="password" id="senhaAdminInput" placeholder="Senha">
      <button class="btn-pri" style="width:100%;" onclick="verificarSenhaAdmin()">Entrar</button>
    </div>
  </div>

  <div class="wrap" id="conteudoAdmin" style="display:none;">
    <header>
      <h1>⚙️ Gerenciador de Programação (Admin)</h1>
      <button class="btn-pri" onclick="adicionarBlocoAdmin()">+ Adicionar Bloco</button>
    </header>

    <div id="listaBlocosAdmin">Carregando dados do Firebase...</div>

    <div style="margin-top: 20px; text-align: right;">
      <button class="btn-pri" style="padding: 12px 24px; font-size: 16px;" onclick="salvarTudoAdmin()">💾 Salvar Alterações na Nuvem</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzzQg4fMWQm82aOu2xM2huVPvHeyitFxQ",
    authDomain: "controle-remoto-da345.firebaseapp.com",
    databaseURL: "https://controle-remoto-da345-default-rtdb.firebaseio.com",
    projectId: "controle-remoto-da345",
    storageBucket: "controle-remoto-da345.firebasestorage.app",
    messagingSenderId: "246457543992",
    appId: "1:246457543992:web:41bf1bd64a4788fb2625cd",
    measurementId: "G-CFHSFG82SX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();

  let usuarioAtualUid = null;
  let dadosBlocos = [];

  window.verificarSenhaAdmin = () => {
    const senha = document.getElementById('senhaAdminInput').value;
    if (senha === "kbstvcolombo") {
      document.getElementById('telaLoginAdmin').style.display = 'none';
      document.getElementById('conteudoAdmin').style.display = 'block';
      autenticarAdminNoFirebase();
    } else {
      alert("Senha incorreta!");
      document.getElementById('senhaAdminInput').value = "";
    }
  };

  function autenticarAdminNoFirebase() {
    onAuthStateChanged(auth, (user) => {
      if (user) {
        usuarioAtualUid = user.uid;
        carregarDoFirebase();
      } else {
        signInWithPopup(auth, provider).then((result) => {
          usuarioAtualUid = result.user.uid;
          carregarDoFirebase();
        }).catch(err => alert("Erro ao autenticar no Firebase: " + err.message));
      }
    });
  }

  function carregarDoFirebase() {
    const refBlocos = ref(db, `usuarios/${usuarioAtualUid}/player_m3u`);
    get(refBlocos).then((snapshot) => {
      if (snapshot.exists()) {
        const val = snapshot.val();
        dadosBlocos = Array.isArray(val) ? val : Object.values(val);
      } else {
        dadosBlocos = [];
      }
      renderizarAdmin();
    });
  }

  window.renderizarAdmin = function() {
    const container = document.getElementById('listaBlocosAdmin');
    container.innerHTML = "";

    if (dadosBlocos.length === 0) {
      container.innerHTML = "<p>Nenhum bloco cadastrado. Clique em 'Adicionar Bloco'.</p>";
      return;
    }

    dadosBlocos.forEach((b, index) => {
      let diasArr = Array.isArray(b.dias) ? b.dias : [];
      let linksArr = Array.isArray(b.fbLinks) ? b.fbLinks : (b.fb ? [b.fb] : [""]);

      const card = document.createElement('div');
      card.className = 'bloco-admin';
      card.innerHTML = `
        <h3>Bloco ${index + 1}</h3>
        <div class="row">
          <label>Nome do Bloco:</label>
          <input type="text" id="nome_${index}" value="${b.nome || ''}" placeholder="Ex: Jornal da Noite">
        </div>
        <div class="row">
          <label>Início:</label>
          <input type="time" step="1" id="inicio_${index}" value="${b.inicio || '00:00:00'}">
          <label>Fim:</label>
          <input type="time" step="1" id="fim_${index}" value="${b.fim || '00:00:00'}">
        </div>
        <div class="row" style="flex-direction: column; align-items: flex-start;">
          <label>Dias da Semana:</label>
          <div class="dias-grid">
            ${['segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado', 'domingo'].map(d => `
              <label><input type="checkbox" class="dia_chk_${index}" value="${d}" ${diasArr.includes(d) ? 'checked' : ''}> ${d.charAt(0).toUpperCase() + d.slice(1)}</label>
            `).join('')}
          </div>
        </div>
        <div class="row">
          <label>Link YouTube:</label>
          <input type="text" id="yt_${index}" value="${b.yt || ''}" placeholder="https://youtube.com/watch?v=...">
        </div>
        <div class="row">
          <label>Link M3U / Live:</label>
          <input type="text" id="m3u_${index}" value="${b.m3u || ''}" placeholder="https://exemplo.com/stream.m3u8">
        </div>
        <div style="margin-top: 10px;">
          <label style="color: #ffd700; font-weight: bold;">Links de Vídeos da Nuvem (Sequência):</label>
          <div id="links_container_${index}" style="margin-top: 5px;">
            ${linksArr.map((linkVal, lIdx) => `
              <div class="link-row">
                <input type="text" class="link_input_${index}" value="${linkVal}" placeholder="Cole o link direto do vídeo .mp4">
                <button class="btn-del" onclick="removerLinhaLink(${index}, ${lIdx})">X</button>
              </div>
            `).join('')}
          </div>
          <button style="margin-top: 5px; font-size: 11px; background: #1976d2;" onclick="adicionarLinhaLink(${index})">+ Adicionar Vídeo na Sequência</button>
        </div>
        <button class="btn-del" style="margin-top: 15px; width: 100%;" onclick="removerBlocoAdmin(${index})">🗑 Excluir Bloco ${index + 1}</button>
      `;
      container.appendChild(card);
    });
  };

  window.adicionarBlocoAdmin = () => {
    coletarDadosTela();
    dadosBlocos.push({ nome: "", inicio: "12:00:00", fim: "13:00:00", dias: ["segunda"], yt: "", m3u: "", fbLinks: [""] });
    renderizarAdmin();
  };

  window.removerBlocoAdmin = (index) => {
    coletarDadosTela();
    dadosBlocos.splice(index, 1);
    renderizarAdmin();
  };

  window.adicionarLinhaLink = (index) => {
    coletarDadosTela();
    if (!Array.isArray(dadosBlocos[index].fbLinks)) dadosBlocos[index].fbLinks = [];
    dadosBlocos[index].fbLinks.push("");
    renderizarAdmin();
  };

  window.removerLinhaLink = (index, lIdx) => {
    coletarDadosTela();
    dadosBlocos[index].fbLinks.splice(lIdx, 1);
    renderizarAdmin();
  };

  function coletarDadosTela() {
    dadosBlocos.forEach((b, index) => {
      b.nome = document.getElementById(`nome_${index}`).value;
      b.inicio = document.getElementById(`inicio_${index}`).value;
      b.fim = document.getElementById(`fim_${index}`).value;
      b.yt = document.getElementById(`yt_${index}`).value;
      b.m3u = document.getElementById(`m3u_${index}`).value;

      const chks = document.querySelectorAll(`.dia_chk_${index}:checked`);
      b.dias = Array.from(chks).map(c => c.value);

      const inputsLink = document.querySelectorAll(`.link_input_${index}`);
      b.fbLinks = Array.from(inputsLink).map(i => i.value.trim()).filter(v => v !== "");
    });
  }

  window.salvarTudoAdmin = () => {
    if (!usuarioAtualUid) return alert("Usuário não autenticado.");
    coletarDadosTela();

    // Adiciona timestamp para forçar atualização imediata no player remoto
    const dadosParaSalvar = dadosBlocos.map(b => ({
      ...b,
      timestamp: Date.now()
    }));

    const refBlocos = ref(db, `usuarios/${usuarioAtualUid}/player_m3u`);
    set(refBlocos, dadosParaSalvar)
      .then(() => alert("Programação salva com sucesso e enviada para a nuvem!"))
      .catch(err => alert("Erro ao salvar: " + err.message));
  };
</script>

</body>
</html>
