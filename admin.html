<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Admin – Programação KBS TV com Múltiplos Vídeos</title>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzzQg4fMWQm82aOu2xM2huVPvHeyitFxQ",
    authDomain: "controle-remoto-da345.firebaseapp.com",
    databaseURL: "https://controle-remoto-da345-default-rtdb.firebaseio.com",
    projectId: "controle-remoto-da345",
    storageBucket: "controle-remoto-da345.firebasestorage.app",
    messagingSenderId: "246457543992",
    appId: "1:246457543992:web:41bf1bd64a4788fb2625cd",
    measurementId: "G-CFHSFG82SX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);

  let blocosRef = null;

  setPersistence(auth, browserLocalPersistence)
    .then(() => {
      onAuthStateChanged(auth, (user) => {
        if (user) {
          blocosRef = ref(db, `usuarios/${user.uid}/player_m3u`);
          onValue(blocosRef, snap => atualizarLista(snap.val()));
          console.log("Admin conectado à pasta: " + user.uid);
        } else {
          alert("Acesso negado. Faça login no Player primeiro.");
          window.location.href = "index.html"; 
        }
      });
    })
    .catch((error) => {
      console.error("Erro ao configurar persistência de login:", error);
    });

  function atualizarLista(dados) {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    const diasSemana = ["segunda", "terca", "quarta", "quinta", "sexta", "sabado", "domingo"];

    Object.keys(dados || {}).forEach(i => {
      const b = dados[i];
      const diasSelecionados = b.dias || []; 
      
      // Garante que fbLinks seja um array de links (compatibilidade retroativa com 'fb' string antiga)
      let linksArray = [];
      if (Array.isArray(b.fbLinks)) {
        linksArray = b.fbLinks;
      } else if (b.fb) {
        linksArray = [b.fb];
      }

      const card = document.createElement("div");
      card.className = "card";
      
      let diasHTML = '<div class="dias-check">';
      diasSemana.forEach(dia => {
        const checked = diasSelecionados.includes(dia) ? "checked" : "";
        diasHTML += `
          <label style="display:block; font-size:12px;">
            <input type="checkbox" class="dia-${i}" value="${dia}" ${checked}> ${dia.charAt(0).toUpperCase() + dia.slice(1)}
          </label>`;
      });
      diasHTML += '</div>';

      let linksHtml = `<div id="container-links-${i}" class="links-container">`;
      linksArray.forEach((linkVal, indexLink) => {
        linksHtml += `
          <div class="linha-link" style="display:flex; gap:5px; margin-bottom:5px;">
            <input type="text" class="input-fb-${i}" value="${linkVal}" placeholder="Link do vídeo ${indexLink + 1} (Ex: Abertura / Repórter / Final)">
            <button type="button" onclick="removerLinhaLink(this)" style="background:#b71c1c; width:35px; margin-top:0; padding:0;">X</button>
          </div>`;
      });
      linksHtml += `</div>`;

      card.innerHTML = `
        <h3>Bloco ${i} ${b.nome ? '- ' + b.nome : ''}</h3>
        
        <label>Nome de identificação:</label>
        <input id="nome-${i}" value="${b.nome || ''}" placeholder="Ex: Jornal KBS">

        <label>Link M3U (Opcional):</label>
        <input id="m3u-${i}" value="${b.m3u || ''}">
        
        <label>Link YouTube (Opcional):</label>
        <input id="yt-${i}" value="${b.yt || ''}">

        <label style="color: #4fc3f7;">Lista de Vídeos em Sequência (Nuvem):</label>
        <small style="color:#aaa; display:block; margin-bottom:5px; font-size:10px;">Adicione na ordem: 1º Abertura, 2º Repórter, 3º Final...</small>
        ${linksHtml}
        <button type="button" onclick="adicionarLinhaLink(${i})" style="background:#2e7d32; font-size:11px; margin-bottom:10px; padding:6px;">+ Adicionar Vídeo na Sequência</button>
        
        <label>Dias da semana:</label>
        ${diasHTML}

        <label>Hora início (com segundos):</label>
        <input id="inicio-${i}" type="time" step="1" value="${b.inicio || '00:00:00'}">
        
        <label>Hora fim (com segundos):</label>
        <input id="fim-${i}" type="time" step="1" value="${b.fim || '00:00:00'}">
        
        <button class="saveBtn" onclick="salvar(${i})">💾 Salvar Bloco</button>
        <button class="deleteBtn" onclick="apagar(${i})">🗑 Apagar Bloco</button>
      `;
      lista.appendChild(card);
    });
  }

  window.adicionarLinhaLink = function(i) {
    const container = document.getElementById(`container-links-${i}`);
    const div = document.createElement('div');
    div.className = "linha-link";
    div.style = "display:flex; gap:5px; margin-bottom:5px;";
    div.innerHTML = `
      <input type="text" class="input-fb-${i}" value="" placeholder="Cole o link do próximo vídeo">
      <button type="button" onclick="removerLinhaLink(this)" style="background:#b71c1c; width:35px; margin-top:0; padding:0;">X</button>
    `;
    container.appendChild(div);
  };

  window.removerLinhaLink = function(btn) {
    btn.parentElement.remove();
  };

  window.salvar = function(i) {
    if(!auth.currentUser) return;
    
    const checkboxes = document.querySelectorAll(`.dia-${i}:checked`);
    const diasMarcados = Array.from(checkboxes).map(cb => cb.value);

    // Coleta todos os inputs de links da sequência deste bloco
    const inputsLinks = document.querySelectorAll(`.input-fb-${i}`);
    const fbLinksArray = Array.from(inputsLinks).map(inp => inp.value.trim()).filter(val => val !== "");

    const caminho = ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${i}`);
    set(caminho, {
      nome: document.getElementById("nome-" + i).value,
      m3u: document.getElementById("m3u-" + i).value,
      yt: document.getElementById("yt-" + i).value,
      fbLinks: fbLinksArray, // Salva a lista ordenada
      fb: fbLinksArray[0] || "", // Retrocompatibilidade com campo único
      dias: diasMarcados,
      inicio: document.getElementById("inicio-" + i).value,
      fim: document.getElementById("fim-" + i).value,
      timestamp: Date.now()
    });
    alert("✔ Bloco salvo com sucesso!");
  };

  window.apagar = function(i) {
    if (!confirm("Deseja realmente apagar este bloco?")) return;
    remove(ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${i}`));
  };

  window.adicionarBloco = function() {
    if(!auth.currentUser) return;
    onValue(blocosRef, snap => {
      const dados = snap.val() || {};
      const chaves = Object.keys(dados).map(Number);
      const novoID = chaves.length > 0 ? Math.max(...chaves) + 1 : 0;
      
      set(ref(db, `usuarios/${auth.currentUser.uid}/player_m3u/${novoID}`), {
        nome: "Bloco Sequencial", m3u: "", yt: "", fbLinks: [""], fb: "", dias: ["segunda", "terca", "quarta", "quinta", "sexta"], inicio: "00:00:00", fim: "00:00:00", timestamp: Date.now()
      });
    }, { onlyOnce: true });
  };
</script>

<style>
body { background:#111; color:#fff; font-family: 'Segoe UI', Arial, sans-serif; padding: 20px; margin: 0; }
#topBar { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom: 2px solid #2e7d32; padding-bottom: 15px; }
#addBtn { background:#2e7d32; padding:12px 20px; border:none; color:white; border-radius:8px; cursor:pointer; font-weight: bold; font-size: 14px; }
#addBtn:hover { background:#3e8d42; }

#lista {
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
}

.card { background:#1b1b1b; padding:20px; border-radius:12px; border:1px solid #333; width:360px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }

label { font-size: 11px; color: #aaa; display: block; margin-top: 8px; margin-bottom: 3px; font-weight: bold; text-transform: uppercase; }
input { width:100%; margin-bottom:5px; padding:8px; background:#111; border:1px solid #444; color:white; border-radius:6px; box-sizing: border-box; font-size: 13px;}
input:focus { border-color: #2e7d32; outline: none; }

button { width:100%; padding:10px; border:none; color:white; border-radius:8px; margin-top:10px; cursor:pointer; font-weight: bold; font-size: 13px; }
.saveBtn { background:#1976d2; }
.saveBtn:hover { background:#2a82d8; }
.deleteBtn { background:#b71c1c; }
.deleteBtn:hover { background:#d32f2f; }

h1 { margin: 0; font-size: 22px; color: #fff; }
h3 { margin-top: 0; color: #ffd700; text-align: center; border-bottom: 1px solid #333; padding-bottom: 10px; font-size: 16px; }

.dias-check { 
  background: #111; 
  padding: 10px; 
  border-radius: 6px; 
  margin-bottom: 8px; 
  border: 1px solid #444;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 5px;
}
.dias-check label { color: #ddd; font-weight: normal; text-transform: none; margin: 0; display: flex; align-items: center; cursor: pointer; }
.dias-check input { width: auto; margin-right: 6px; margin-bottom: 0; cursor: pointer; }
</style>
</head>
<body>
<div id="topBar">
  <h1>⚙️ Painel Admin – Múltiplos Vídeos em Sequência</h1>
  <button id="addBtn" onclick="adicionarBloco()">+ Adicionar Bloco Sequencial</button>
</div>
<div id="lista">Carregando seus blocos programados...</div>
</body>
</html>
