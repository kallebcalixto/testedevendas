<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Player Programado — KBS TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { 
    color-scheme: dark; 
    --primary-color: #2e7d32; 
    --error-color: #ff4d4d;
    --gold: #ffd700;
  }
  body {
    background:#000;
    color:#eee;
    font-family: 'Segoe UI', Arial, sans-serif;
    margin:0;
    overflow: auto !important; 
    min-width: 100vw;
    min-height: 101vh;
    position: relative;
    user-select: none;
  }

  .movel {
    position: absolute !important;
    cursor: move;
    z-index: 10;
    transition: outline 0.2s;
  }
  
  .redimensionavel {
    overflow: auto; 
    box-sizing: border-box;
  }
  .modo-edicao .movel {
    outline: 2px dashed var(--primary-color);
    background: rgba(46, 125, 50, 0.05);
  }
  .modo-edicao .redimensionavel {
    resize: both; 
  }

  #btn-trava-layout {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 999999;
    padding: 15px 25px;
    border-radius: 50px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    display: flex;
    align-items: center;
    gap: 10px;
    border: 2px solid #fff;
    cursor: pointer;
  }
  .layout-destravado { background: #ff4d4d !important; color: #fff; }
  .layout-travado { background: #2e7d32 !important; color: #fff; }

  #tela-pagamento {
    position: fixed; 
    top: 0; left: 0; 
    width: 100%; height: 100%; 
    background: radial-gradient(circle, #1a1a1a 0%, #000 100%);
    display: none; 
    justify-content: center; 
    align-items: center; 
    z-index: 100000;
    backdrop-filter: blur(10px);
  }

  .painel-premium {
    background: #161616;
    padding: 40px;
    border-radius: 24px;
    border: 1px solid #333;
    width: 100%;
    max-width: 450px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
  }

  .painel-premium::before {
    content: "";
    position: absolute;
    top: 0; left: 0; width: 100%; height: 4px;
    background: linear-gradient(90deg, transparent, var(--error-color), transparent);
  }

  .status-badge {
    background: var(--error-color);
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
    text-transform: uppercase;
    display: inline-block;
    margin-bottom: 20px;
  }

  .painel-premium h2 {
    font-size: 32px;
    margin: 10px 0;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
  }

  .painel-premium p {
    color: #aaa;
    margin-bottom: 30px;
    font-size: 15px;
  }

  .btn-plano-premium {
    width: 100%;
    padding: 20px;
    margin: 12px 0;
    background: linear-gradient(145deg, #1e1e1e, #141414);
    border: 1px solid #333;
    color: #fff;
    border-radius: 16px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-plano-premium:hover {
    border-color: var(--primary-color);
    transform: translateY(-2px);
    background: #1f1f1f;
    box-shadow: 0 5px 15px rgba(46, 125, 50, 0.2);
  }

  .btn-plano-premium .nome {
    font-weight: bold;
    font-size: 16px;
    text-transform: uppercase;
  }

  .btn-plano-premium .preco {
    color: var(--primary-color);
    font-weight: 900;
    font-size: 18px;
  }

  .btn-plano-premium.destaque { border-color: var(--gold); }
  .btn-plano-premium.destaque .preco { color: var(--gold); }

  #qrcode-container {
    margin-top: 25px; background: #000; padding: 20px; border-radius: 16px;
    border: 1px solid #222; display: flex; flex-direction: column; align-items: center; gap: 10px;
  }

  #tela-login {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; display: flex; justify-content: center; align-items: center; z-index: 99999;
  }
  .card-login {
    background: #1b1b1b; padding: 40px 30px; border-radius: 12px;
    border: 1px solid #333; width: 340px; text-align: center;
  }
  .card-login h2 { margin-bottom: 10px; color: #2e7d32; font-weight: 900; }
  .card-login p { color: #888; font-size: 14px; margin-bottom: 25px; }

  header { padding:16px 20px; background:#1b1b1b; border:1px solid #2a2a2a; display: flex; flex-direction: column; border-radius: 10px; }
  header h1 { margin:0 0 6px 0; font-size:18px; flex-shrink: 0; }
  #grade { white-space:pre-line; font-size:13px; color:#ddd; flex-grow: 1; overflow-y:auto; }
  
  .wrap { max-width:1200px; margin:0 auto; padding:20px; }
  .top { display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; justify-content:center; }

  #player, #ytplayer { 
    width:500px; height:280px; 
    background:#000 !important;
    border:1px solid #333; border-radius:8px; 
    transition: opacity 0.15s ease-in-out; 
  }

  video::-webkit-media-controls-start-playback-button { display: none !important; }
  video::-internal-media-controls-loading-indicator { display: none !important; }
  video::-webkit-media-controls-panel { background-color: rgba(0,0,0,0.5) !important; }

  #player { object-fit: contain; display:block; }
  #ytplayer { display:none; }
  .controls { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  button { padding:8px 12px; border:none; border-radius:8px; cursor:pointer; background:#2f2f2f; color:#fff; }
  button:hover { background:#454545; }
  .btn-pri { background:#2e7d32; } .btn-pri:hover{ background:#3e8d42; }
  .btn-sec { background:#1976d2; } .btn-sec:hover{ background:#2a82d8; }
  .btn-admin { background:#6200ee; font-weight: bold; } .btn-admin:hover { background:#7c4dff; }
   
  .grid { 
    display:flex; 
    flex-wrap: wrap; 
    gap:12px; 
    margin-top:18px; 
    overflow-y: scroll !important; 
    overflow-x: scroll !important; 
    padding-bottom: 25px; 
    padding-right: 25px;
    box-sizing: border-box;
  }
   
  .bloco { position:relative; flex:0 0 260px; border:1px solid #2b2b2b; background:#171717; border-radius:10px; padding:12px; }
  .bloco h3 { margin:0 0 10px 0; font-size:15px; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:8px; }
  .row input[type="time"] { width:130px; }
  .hint { font-size:12px; color:#aaa; margin-top: 5px; }
  .badge { display:inline-block; padding:2px 8px; border-radius:999px; background:#2a2a2a; font-size:12px; margin-left:6px; }
  .running::before {
    content:"Em execução"; position:absolute; top:0; left:0; right:0;
    background:#2e7d32; color:#fff; font-size:12px; text-align:center;
    padding:2px 0; border-radius:10px 10px 0 0;
  }
  .mini-btn { padding:4px 6px; margin:2px; border:none; border-radius:6px; cursor:pointer; background:#444; color:#fff; font-size:12px; }
  .mini-btn:hover { background:#666; }

  /* ESTILOS DOS LETREIROS COM MÁXIMA QUALIDADE */
  #letreiro-kbs-auto {
    position: absolute; top: 20px; left: 20px; z-index: 999;
    background: transparent; color: #ffd700; border-left: 5px solid #ffd700;
    padding: 10px 20px; font-weight: bold; font-size: 14px;
    display: none; align-items: center; gap: 10px; border-radius: 0 8px 8px 0;
    text-shadow: 2px 2px 4px #000; 
    cursor: move;
    user-select: none;
    transition: color 0.3s, border-color 0.3s;
  }
  #letreiro-logo-img { 
    height: 28px; width: auto; max-height: 35px; display: none; pointer-events: none; 
    image-rendering: -webkit-optimize-contrast; 
    image-rendering: high-quality;
  }
  #letreiro-texto-arquivo { pointer-events: none; }

  #letreiro-aseguir {
    position: absolute; top: 70px; left: 20px; z-index: 998;
    background: transparent; color: #ffffff; border-left: 5px solid #ffffff;
    padding: 10px 20px; font-weight: bold; font-size: 14px;
    display: none; align-items: center; gap: 10px; border-radius: 0 8px 8px 0;
    text-shadow: 2px 2px 4px #000; 
    cursor: move;
    user-select: none;
    transition: color 0.3s, border-color 0.3s;
  }
  #letreiro-logo-aseguir { 
    height: 28px; width: auto; max-height: 35px; display: none; pointer-events: none; 
    image-rendering: -webkit-optimize-contrast; 
    image-rendering: high-quality;
  }
  #letreiro-texto-aseguir { pointer-events: none; }

  #banner-somente-logo {
    position: absolute; top: 120px; left: 20px; z-index: 1001; cursor: move; display: flex; align-items: center;
    justify-content: center; overflow: hidden; resize: both; width: 80px; height: 80px; min-width: 20px; min-height: 20px;
  }
  #img-banner-fixo { 
    width: 100%; height: 100%; object-fit: contain; pointer-events: none; display: none; 
    image-rendering: -webkit-optimize-contrast; 
    image-rendering: high-quality;
  }

  @keyframes piscarVermelho {
    0% { background-color: #d32f2f; box-shadow: 0 0 5px #ff0000; }
    50% { background-color: #ff1744; box-shadow: 0 0 20px #ff5252; transform: scale(1.02); }
    100% { background-color: #d32f2f; box-shadow: 0 0 5px #ff0000; }
  }
  .btn-renovar-alerta {
    background-color: #d32f2f; color: white; border: 2px solid #fff; padding: 5px 12px; border-radius: 6px;
    font-weight: bold; font-size: 11px; cursor: pointer; animation: piscarVermelho 1s infinite;
    text-transform: uppercase; text-align: center; display: inline-block;
  }

  .switch input:checked + .slider { background-color: #2e7d32; }
  .switch input:focus + .slider { box-shadow: 0 0 1px #2e7d32; }
  .switch input:checked + .slider:before { transform: translateX(14px); }
  .slider:before {
    position: absolute; content: ""; height: 16px; width: 16px; left: 2px; bottom: 2px;
    background-color: white; transition: .4s; border-radius: 50%;
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
  import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut, setPersistence, browserLocalPersistence } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBzzQg4fMWQm82aOu2xM2huVPvHeyitFxQ",
    authDomain: "controle-remoto-da345.firebaseapp.com",
    databaseURL: "https://controle-remoto-da345-default-rtdb.firebaseio.com",
    projectId: "controle-remoto-da345",
    storageBucket: "controle-remoto-da345.firebasestorage.app",
    messagingSenderId: "246457543992",
    appId: "1:246457543992:web:41bf1bd64a4788fb2625cd",
    measurementId: "G-CFHSFG82SX"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const auth = getAuth(app);
  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  setPersistence(auth, browserLocalPersistence).catch((error) => console.error(error));

  window.fazerLoginGoogle = () => {
    setPersistence(auth, browserLocalPersistence)
      .then(() => signInWithPopup(auth, provider))
      .then((result) => {
        if (result && result.user) {
          const user = result.user;
          document.getElementById('tela-login').style.display = 'none';
          const playerRef = ref(db, `usuarios/${user.uid}/player_m3u/0`);
          get(playerRef).then((snapshot) => {
            if (!snapshot.exists()) {
              set(playerRef, { dia: "segunda", inicio: "12:00", fim: "13:00", m3u: "https://srv4.zcast.com.br/samircalixto/samircalixto/playlist.m3u8", yt: "", timestamp: Date.now() });
            }
          });
        }
      })
      .catch(err => alert("Erro ao conectar com Google. Verifique os bloqueadores ou permissões."));
  };

  window.ativarTeste7Dias = () => {
    const user = auth.currentUser;
    if (!user) return;
    const configRef = ref(db, `usuarios/${user.uid}/config`);
    get(configRef).then((snapshot) => {
      const config = snapshot.val() || {};
      if (config.testeUtilizado) { alert("Desculpe, este e-mail já utilizou o período de 7 dias de teste grátis."); return; }
      const seteDiasEmMilisegundos = Date.now() + (7 * 24 * 60 * 60 * 1000);
      set(configRef, { expiracao: seteDiasEmMilisegundos, testeUtilizado: true })
      .then(() => alert("Teste de 7 dias ativado com sucesso! Aproveite o seu player."))
      .catch(err => alert("Erro ao ativar teste: " + err.message));
    });
  };

  window.fazerLogout = () => { signOut(auth).then(() => location.reload()).catch(err => alert("Erro ao sair: " + err.message)); };

  onAuthStateChanged(auth, (user) => {
    if (user) {
      document.getElementById('tela-login').style.display = 'none';
      onValue(ref(db, `usuarios/${user.uid}/config`), snap => {
        const config = snap.val() || { expiracao: 0, testeUtilizado: false };
        const agora = Date.now();
        const btnTeste = document.getElementById('btn-teste-7dias');
        if (config.testeUtilizado) { if (btnTeste) btnTeste.style.display = 'none'; } 
        else { if (btnTeste) btnTeste.style.display = 'flex'; }

        atualizarContadorPlano(config.expiracao);

        if (config.expiracao < agora) {
          document.getElementById('tela-pagamento').style.display = 'flex';
          document.getElementById('conteudo-player').style.display = 'none';
        } else {
          document.getElementById('tela-pagamento').style.display = 'none';
          document.getElementById('conteudo-player').style.display = 'block';
          const blocosRef = ref(db, `usuarios/${user.uid}/player_m3u`);
          iniciarLeituraFirebase(blocosRef);
        }
      });
    } else {
      document.getElementById('tela-login').style.display = 'flex';
      document.getElementById('conteudo-player').style.display = 'none';
      document.getElementById('tela-pagamento').style.display = 'none';
    }
  });

  window.abrirTelaPagamento = function() {
    document.getElementById('tela-pagamento').style.display = 'flex';
  };

  function atualizarContadorPlano(expiracaoMs) {
    const containerContador = document.getElementById('contador-plano-container');
    if (!containerContador) return;

    if (!expiracaoMs || expiracaoMs <= Date.now()) {
      containerContador.innerHTML = `<span style="color:#ff4d4d; font-size:11px; font-weight:bold;">PLANO EXPIRADO</span>`;
      return;
    }

    const diffMs = expiracaoMs - Date.now();
    const dias = Math.floor(diffMs / (1000 * 60 * 60 * 24));
    const horas = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutos = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
    const segundos = Math.floor((diffMs % (1000 * 60)) / 1000);

    if (dias <= 5) {
      containerContador.innerHTML = `
        <button class="btn-renovar-alerta" onclick="abrirTelaPagamento()">
          ⚠️ Clique aqui para renovar seu plano (${dias}d ${horas}h)
        </button>
      `;
    } else {
      containerContador.innerHTML = `
        <div style="font-size: 10px; color: #ffd700; font-weight: bold; margin-bottom: 2px; text-align: center;">PLANO RESTANTE:</div>
        <div style="font-size: 11px; color: #fff; font-weight: bold;">${dias}d ${horas}h ${minutos}m ${segundos}s</div>
      `;
    }
  }

  setInterval(() => {
    const user = auth.currentUser;
    if (!user) return;
    get(ref(db, `usuarios/${user.uid}/config`)).then(snap => {
      const config = snap.val();
      if (config && config.expiracao) {
        atualizarContadorPlano(config.expiracao);
        if (config.expiracao < Date.now()) {
          document.getElementById('tela-pagamento').style.display = 'flex';
          document.getElementById('conteudo-player').style.display = 'none';
        }
      }
    });
  }, 1000);

  window.gerarPix = async (valorPlano) => {
    const container = document.getElementById('qrcode-container');
    container.innerHTML = "<p>Gerando código PIX seguro...</p>";
    try {
      const res = await fetch("https://kbs-backend-k3d0.onrender.com/gerar-pix", {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: auth.currentUser.email, uid: auth.currentUser.uid, valor: valorPlano })
      });
      const data = await res.json();
      if(data.qr_code_base64) {
        container.innerHTML = `
          <img src="data:image/png;base64,${data.qr_code_base64}" style="width:180px; background:white; padding:10px; border-radius:12px; box-shadow: 0 0 20px rgba(255,255,255,0.1);">
          <div style="margin-top:10px; font-size:11px; color:#2e7d32; font-weight:bold;">CÓDIGO COPIA E COLA:</div>
          <div style="font-size:10px; color:#888; word-break:break-all; background:#111; padding:8px; border:1px solid #333; width:100%; box-sizing:border-box;">${data.qr_code}</div>
          <button onclick="navigator.clipboard.writeText('${data.qr_code}').then(()=>alert('Copiado!'))" style="margin-top:5px; background:#333; font-size:11px;">Copiar Código</button>
        `;
      }
    } catch (e) { alert("Erro ao conectar com servidor."); container.innerHTML = ""; }
  };

  window._firebase_db = db;
  window._firebase_ref = ref;
  window._firebase_set = set;
  window._firebase_onValue = onValue;

  window.iniciarLeituraFirebase = function(referenciaDinamica) {
      window._firebase_onValue(referenciaDinamica, snap => {
          const dadosFirebase = snap.val() || {};
          let blocoAtual = blocos[idxBloco];
          let idPlaying = null;
          if (blocoAtual) {
              if (blocoAtual.tipo === 'youtube' && blocoAtual._firebaseIndex !== undefined) {
                  idPlaying = 'fb_' + blocoAtual._firebaseIndex;
              } else {
                  idPlaying = 'local_' + idxBloco;
              }
          }
          let blocosManter = blocos.filter(b => b.tipo !== 'youtube' && b._firebaseIndex === undefined);
          let novosBlocosAgendados = [];

          Object.keys(dadosFirebase).forEach(i => {
              const d = dadosFirebase[i];
              const blocoAntigo = blocos.find(b => b._firebaseIndex === i);
              const ytMudou = blocoAntigo && (blocoAntigo.ytlink !== (d.yt || ''));
              const m3uMudou = blocoAntigo && (blocoAntigo.m3ulink !== (d.m3u || ''));
              const estavaRodando = (blocoAntigo && !ytMudou && !m3uMudou) ? blocoAntigo._agendadoRodando : false;

              novosBlocosAgendados.push({
                  tipo: 'youtube', nome: d.nome || '', arquivos: [], progresso: [], tempo: 0, sessaoRestante: 0, pauseRestante: 0, arquivoAtual: 0, limitePorCiclo: 0,
                  ytlink: d.yt || '', m3ulink: d.m3u || '', diaSemana: d.dias || d.dia || [], horaInicio: d.inicio || '', horaFim: d.fim || '', removido: false, _agendadoRodando: estavaRodando, _firebaseIndex: i 
              });
          });
          blocos = [...blocosManter, ...novosBlocosAgendados];
          
          if (idPlaying && idPlaying.startsWith('fb_')) {
              const fbId = idPlaying.split('_')[1];
              const novoIndex = blocos.findIndex(b => b._firebaseIndex === fbId);
              if (novoIndex !== -1) { idxBloco = novoIndex; }
          }
          
          blocosEl.innerHTML = '';
          blocos.forEach((b, i) => {
              renderizarBloco(i, b);
              if (i === idxBloco && b._agendadoRodando) {
                  const card = document.getElementById(`bloco-${i}`);
                  if (card) card.classList.add('running');
              }
          });
          atualizarGrade();
          if (idxBloco >= blocos.length) idxBloco = 0;
      });
  };
</script>
</head>

<body>
  <div id="tela-pagamento">
    <div class="painel-premium">
      <div class="status-badge">Sinal Interrompido</div>
      <h2>Acesso Expirado</h2>
      <p>Sua licença KBS TV chegou ao fim. Selecione um plano abaixo ou ative seu teste gratuito para liberar o player:</p>
      <button id="btn-teste-7dias" class="btn-plano-premium destaque" onclick="ativarTeste7Dias()" style="background: linear-gradient(145deg, #1b5e20, #2e7d32); border-color: var(--gold);">
        <span class="nome">🎁 Ativar 7 Dias de Teste</span><span class="preco">GRÁTIS</span>
      </button>
      <button class="btn-plano-premium" onclick="gerarPix(29.90)"><span class="nome">Plano Mensal</span><span class="preco">R$ 29,90</span></button>
      <button class="btn-plano-premium destaque" onclick="gerarPix(230.90)"><span class="nome">Plano Semestral 🌟</span><span class="preco">R$ 230,90</span></button>
      <button class="btn-plano-premium" onclick="gerarPix(349.90)"><span class="nome">Plano Anual</span><span class="preco">R$ 349,90</span></button>
      <div id="qrcode-container"></div>
      <button onclick="fazerLogout()" style="background:none; border:none; color:#555; text-decoration:underline; cursor:pointer; margin-top:20px; font-size:13px;">Alternar conta de usuário</button>
    </div>
  </div>

  <div id="tela-login">
    <div class="card-login">
      <h2>KBS TV</h2>

<script>
const video = document.getElementById('player');
const ytplayer = document.getElementById('ytplayer');
const gradeEl = document.getElementById('grade');
const blocosEl = document.getElementById('blocos');

let blocos = [];
let idxBloco = 0;
let timeupdateHandler = null;
let pauseTimer = null;
let blocoAnteriorIdx = -1;
let blocoAnteriorProgresso = 0;
let blocoAnteriorPaused = false;
let hlsInstance = null;
let sistemaIniciado = false;

let ytTempoSalvo = 0;
let ytUltimoPlayTimestamp = 0;

let timerBannerAtivo = null;
let timerOcultarBanner = null;

let timerAseguirAtivo = null;
let timerOcultarAseguir = null;

window.aplicarLayout = function(posicoes) {
  if (!posicoes) return;
  Object.keys(posicoes).forEach(id => {
    if(id === 'player-size') {
      const w = posicoes[id].width;
      const h = posicoes[id].height;
      if(w && h) {
        document.getElementById('playerWidth').value = w;
        document.getElementById('playerHeight').value = h;
        window.resizePlayer();
      }
      return;
    }
    const el = document.getElementById(id);
    if (el) {
      if (posicoes[id].top !== undefined) el.style.top = posicoes[id].top;
      if (posicoes[id].left !== undefined) el.style.left = posicoes[id].left;
      if (posicoes[id].right !== undefined) el.style.right = posicoes[id].right;
      if (posicoes[id].bottom !== undefined) el.style.bottom = posicoes[id].bottom;
      
      if (posicoes[id].width !== undefined) el.style.width = posicoes[id].width;
      if (posicoes[id].height !== undefined) el.style.height = posicoes[id].height;
    }
  });
}

window.salvarHorarioReinicio = function(valor) { localStorage.setItem('kbs_horario_reinicio', valor); };

window.atualizarEstiloLetreiro = function() {
    const cor = document.getElementById('corTextoLetreiro').value;
    const fonte = document.getElementById('fonteLetreiro').value;
    const letreiro = document.getElementById('letreiro-kbs-auto');
    if(letreiro) {
        letreiro.style.color = cor;
        letreiro.style.borderLeftColor = cor; 
        letreiro.style.fontFamily = fonte;
    }
}

window.atualizarEstiloAseguir = function() {
    const cor = document.getElementById('corTextoAseguir').value;
    const fonte = document.getElementById('fonteAseguir').value;
    const letreiro = document.getElementById('letreiro-aseguir');
    if(letreiro) {
        letreiro.style.color = cor;
        letreiro.style.borderLeftColor = cor; 
        letreiro.style.fontFamily = fonte;
    }
}

window.addEventListener('DOMContentLoaded', () => {
    const horarioSalvo = localStorage.getItem('kbs_horario_reinicio');
    if (horarioSalvo) {
        const inputReinicio = document.getElementById('horarioReinicio');
        if (inputReinicio) inputReinicio.value = horarioSalvo;
    }
    
    const layoutSalvo = localStorage.getItem('kbs_layout');
    if (layoutSalvo) {
        window.aplicarLayout(JSON.parse(layoutSalvo));
    }

    reiniciarTimerBanner();
    reiniciarTimerAseguir();
    atualizarEstiloLetreiro(); 
    atualizarEstiloAseguir();
});

let ultimoReinicio = "";
setInterval(() => {
    const inputReinicio = document.getElementById('horarioReinicio');
    if (!inputReinicio || !inputReinicio.value) return;

    const agora = new Date();
    const horaAtual = agora.toTimeString().split(' ')[0].substring(0, 5); 
    const dataHoje = agora.toDateString(); 
    const chaveReinicio = dataHoje + "-" + horaAtual;

    if (horaAtual === inputReinicio.value && ultimoReinicio !== chaveReinicio) {
        ultimoReinicio = chaveReinicio;
        if (blocos.length > 0) { window.iniciar(); }
    }
}, 1000);

function atualizarLogos(url) {
  const logo1 = document.getElementById('letreiro-logo-img');
  const logo2 = document.getElementById('img-banner-fixo');
  const logo3 = document.getElementById('letreiro-logo-aseguir');
  if(url) {
    logo1.src = url; logo1.style.display = 'block';
    logo2.src = url; logo2.style.display = 'block';
    logo3.src = url; logo3.style.display = 'block';
  } else {
    logo1.style.display = 'none'; logo2.style.display = 'none'; logo3.style.display = 'none';
  }
}

window.reiniciarTimerBanner = function() {
    if (timerBannerAtivo) clearInterval(timerBannerAtivo);
    if (timerOcultarBanner) clearTimeout(timerOcultarBanner);
    
    let ligado = document.getElementById('toggleLetreiro').checked;
    if (!ligado) {
        document.getElementById('letreiro-kbs-auto').style.display = 'none';
        return; 
    }
    let intervaloMinutos = parseFloat(document.getElementById('intervaloLetreiro').value) || 3;
    timerBannerAtivo = setInterval(gerenciarBannerKBS, intervaloMinutos * 60 * 1000);
}

window.reiniciarTimerAseguir = function() {
    if (timerAseguirAtivo) clearInterval(timerAseguirAtivo);
    if (timerOcultarAseguir) clearTimeout(timerOcultarAseguir);
    
    let ligado = document.getElementById('toggleAseguir').checked;
    if (!ligado) {
        document.getElementById('letreiro-aseguir').style.display = 'none';
        return; 
    }
    let intervaloMinutos = parseFloat(document.getElementById('intervaloAseguir').value) || 3;
    timerAseguirAtivo = setInterval(gerenciarAseguir, intervaloMinutos * 60 * 1000);
}

function extrairNomeLimpo(nomeBruto) {
    if (!nomeBruto) return "";
    let nomeLimpo = nomeBruto.split(/\.(mp4|mkv|avi|webm|ogg|mov)$/i)[0].split(/DUBLADO|convertido|DVDRip|XviD|_00|1080p|720p/i)[0].replace(/^[\s.]+/, "").trim();
    if(nomeLimpo.endsWith('.')) nomeLimpo = nomeLimpo.slice(0, -1);
    return nomeLimpo;
}

function horarioParaSegundos(strHora) {
    if (!strHora) return 0;
    const partes = strHora.split(':').map(Number);
    const h = partes[0] || 0;
    const m = partes[1] || 0;
    const s = partes[2] || 0;
    return h * 3600 + m * 60 + s;
}

function obterNomeASeguir() {
    if (!blocos || blocos.length === 0) return "";
    
    const agora = new Date();
    const hoje = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"][agora.getDay()];
    const segundosAgora = agora.getHours() * 3600 + agora.getMinutes() * 60 + agora.getSeconds();

    for (let i = 0; i < blocos.length; i++) {
        const b = blocos[i];
        if (b && !b.removido && b.tipo === 'youtube' && b.horaInicio) {
            let diaMatch = false;
            if (Array.isArray(b.diaSemana)) { 
                diaMatch = b.diaSemana.length === 0 || b.diaSemana.includes(hoje); 
            } else { 
                diaMatch = (b.diaSemana === "" || (typeof b.diaSemana === 'string' && b.diaSemana.toLowerCase() === hoje)); 
            }
            
            if (diaMatch) {
                const segundosInicio = horarioParaSegundos(b.horaInicio);
                const diffSegundos = segundosInicio - segundosAgora;
                
                if (diffSegundos >= 0 && diffSegundos <= 600) {
                    const minRestantes = Math.ceil(diffSegundos / 60);
                    let nomeBloco = b.nome ? b.nome : (b.m3ulink ? "Transmissão M3U" : "Transmissão Ao Vivo");
                    return `${nomeBloco} (Entra em ${minRestantes} min, às ${b.horaInicio})`;
                }
            }
        }
    }

    const b = blocos[idxBloco];
    if (!b || b.removido) return "";

    let nextIsNextBlock = false;
    let nomeASeguir = "";

    if (b.tipo === 'movie') {
        if (b.arquivos && b.arquivos.length > 0) {
            if ((b._count || 0) + 1 >= (b.limitePorCiclo || 3)) {
                nextIsNextBlock = true;
            } else if (b.arquivoAtual + 1 >= b.arquivos.length) {
                nextIsNextBlock = true;
            } else {
                nomeASeguir = extrairNomeLimpo(b.arquivos[b.arquivoAtual + 1].file.name);
            }
        } else {
            nextIsNextBlock = true;
        }
    } else if (b.tipo === 'timer') {
         if (b.arquivos && b.arquivos.length > 0) {
             let nextFileIdx = (b.arquivoAtual + 1) % b.arquivos.length;
             nomeASeguir = extrairNomeLimpo(b.arquivos[nextFileIdx].file.name);
         } else {
             nextIsNextBlock = true;
         }
    } else {
        nextIsNextBlock = true;
    }

    if (nextIsNextBlock) {
        let nextIdx = (idxBloco + 1) % blocos.length;
        let loops = 0;
        while (blocos[nextIdx] && blocos[nextIdx].removido && loops < blocos.length) {
            nextIdx = (nextIdx + 1) % blocos.length;
            loops++;
        }

        let nextB = blocos[nextIdx];
        if (nextB && !nextB.removido) {
            if (nextB.tipo === 'youtube') {
                let nomeBloco = nextB.nome ? nextB.nome : (nextB.m3ulink ? "Transmissão M3U" : "Transmissão Ao Vivo");
                let horarioStr = nextB.horaInicio ? ` (às ${nextB.horaInicio})` : "";
                nomeASeguir = `${nomeBloco}${horarioStr}`;
            } else if (nextB.tipo === 'pause') {
                nomeASeguir = nextB.nome ? `Pausa: ${nextB.nome}` : "Pausa Programada";
            } else if (nextB.nome) {
                nomeASeguir = nextB.nome;
            } else if (nextB.arquivos && nextB.arquivos.length > 0) {
                nomeASeguir = extrairNomeLimpo(nextB.arquivos[0].file.name);
            } else {
                nomeASeguir = "Próximo Bloco";
            }
        }
    }

    return nomeASeguir;
}

function gerenciarBannerKBS() {
  let ligado = document.getElementById('toggleLetreiro').checked;
  if (!ligado) return; 

  const bannerAseguir = document.getElementById('letreiro-aseguir');
  if (bannerAseguir.style.display === 'flex') return;

  const b = blocos[idxBloco];
  const banner = document.getElementById('letreiro-kbs-auto');
  
  if (b && b.tipo === 'youtube') {
      banner.style.display = 'none'; 
      return;
  }
  
  if (b && b.arquivos && b.arquivos[b.arquivoAtual]) {
    let nomeLimpo = extrairNomeLimpo(b.arquivos[b.arquivoAtual].file.name);
    document.getElementById('letreiro-texto-arquivo').innerText = "EXIBINDO: " + nomeLimpo;
    const urlLogo = document.getElementById('logoUrl').value;
    atualizarLogos(urlLogo);
    
    atualizarEstiloLetreiro();
    banner.style.display = 'flex';

    let duracaoMs = (parseFloat(document.getElementById('duracaoLetreiro').value) || 20) * 1000;
    if (timerOcultarBanner) clearTimeout(timerOcultarBanner);
    timerOcultarBanner = setTimeout(() => { banner.style.display = 'none'; }, duracaoMs); 
  }
}

function gerenciarAseguir() {
  let ligado = document.getElementById('toggleAseguir').checked;
  if (!ligado) return; 

  const bannerExibindo = document.getElementById('letreiro-kbs-auto');
  if (bannerExibindo.style.display === 'flex') return;

  const banner = document.getElementById('letreiro-aseguir');

  }
}

function fmt(s){ s=Math.max(0,Math.floor(s||0)); const h=String(Math.floor(s/3600)).padStart(2,'0'); const m=String(Math.floor((s%3600)/60)).padStart(2,'0'); const ss=String(s%60).padStart(2,'0'); return `${h}:${m}:${ss}`; }
function timeToSec(str){ if(!str) return 0; const p=str.split(':').map(Number); if(p.length === 3) return p[0]*3600 + p[1]*60 + p[2]; return (p[0]||0)*3600+(p[1]||0)*60; }
function anyPlayableBlocks(){ return blocos.some(b=>b && !b.removido); }

window.adicionarBloco = function(tipo){
  if (tipo === 'youtube') return alert('Blocos YouTube / M3U são gerenciados apenas pelo painel Admin.');
  
  let nomeSugerido = prompt("Digite o nome deste bloco para organizar (ex: Filmes Ação, Jaspion, etc):", "");
  if (nomeSugerido === null) return; 

  const bloco = { nome: nomeSugerido, tipo, arquivos: [], progresso: [], tempo: (tipo==='timer'||tipo==='pause'?300:0), sessaoRestante: 0, pauseRestante: 0, arquivoAtual: 0, limitePorCiclo: (tipo==='movie'?3:0), ytlink:'', m3ulink:'', diaSemana:'', horaInicio:'', horaFim:'', removido:false, _agendadoRodando:false, diasSelecionados: [], horarios: [] };
  const i = blocos.push(bloco)-1;
  renderizarBloco(i, bloco);
  atualizarGrade();
}

window.definirNomeBloco = function(i, valor) {

    <div class="row"><label>Nome:</label><input type="text" placeholder="Ex: Jaspion" value="${bloco.nome || ''}" onchange="definirNomeBloco(${i}, this.value)" style="width:145px; background:#222; color:#fff; border:1px solid #444; border-radius:4px; padding:4px 6px;"></div>
    <div class="row">
      ${(isTimer||bloco.tipo==='movie') ? `<label>Pasta:</label><input type="file" webkitdirectory directory multiple onchange="carregarArquivos(${i}, this.files)">`:''}
      ${isTimer ? `
        <label>Tempo:</label><input type="time" step="1" value="${fmt(bloco.tempo||300)}" oninput="definirTempo(${i}, this.value)">

         </div></div>
        <div style="margin-top:10px; width:100% text-align: left;"><label>Horários Programados:</label><div id="lista-horarios-${i}">${(bloco.horarios || []).map((h, idx) => `<div style="display:flex; gap:5px; margin-bottom:5px;"><input type="time" step="1" value="${h.inicio}" oninput="editHora(${i}, ${idx}, 'inicio', this.value)" style="width:85px;"><input type="time" step="1" value="${h.fim}" oninput="editHora(${i}, ${idx}, 'fim', this.value)" style="width:85px;"><button onclick="removeHora(${i}, ${idx})" style="background:#b71c1c; padding:2px 5px; border-radius:4px;">X</button></div>`).join('')}</div><button onclick="addHora(${i})" style="font-size:11px; width:100%; margin-top:5px; background:#1976d2; color:white; border-radius:5px; padding:5px;">+ Adicionar Horário</button></div>
      `:''}
      ${bloco.tipo==='pause' ? `<label>Tempo:</label><input type="time" step="1" value="${fmt(bloco.tempo||300)}" oninput="definirTempo(${i}, this.value)">`:''}

      ${isYoutubeM3U ? `<label>Início:</label><input type="time" step="1" value="${bloco.horaInicio||''}" disabled><label>Fim:</label><input type="time" step="1" value="${bloco.horaFim||''}" disabled>`:''}

setInterval(()=>{ verificarAgendados(); }, 1000);

function verificarAgendados() {
  if (blocos.length === 0) return;
  const agora = new Date();
  const hoje = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"][agora.getDay()];
  const horaAtual = agora.toTimeString().split(' ')[0];
  let blocoEncontrado = false; let indiceParaRodar = -1;

  for (let i = 0; i < blocos.length; i++) {
    const b = blocos[i]; if (!b || b.removido) continue;
    if (b.tipo === 'timer' && b.horarios && b.horarios.length > 0) {
      const diaMatch = (!b.diasSelecionados || b.diasSelecionados.length === 0 || b.diasSelecionados.includes(hoje));
      const horarioMatch = b.horarios.some(h => horaAtual >= h.inicio && horaAtual < h.fim);
      if (diaMatch && horarioMatch) { blocoEncontrado = true; indiceParaRodar = i; break; }
    }
  }

  if (!blocoEncontrado) {
    for (let i = 0; i < blocos.length; i++) {
      const b = blocos[i]; if (!b || b.removido) continue;
      if (b.tipo === 'youtube') {
        let diaMatch = false;
        if (Array.isArray(b.diaSemana)) { diaMatch = b.diaSemana.length === 0 || b.diaSemana.includes(hoje); } 
        else { diaMatch = (b.diaSemana === "" || (typeof b.diaSemana === 'string' && b.diaSemana.toLowerCase() === hoje)); }
        const dentroDoHorario = (b.horaInicio && b.horaFim && horaAtual >= b.horaInicio && horaAtual < b.horaFim);
        if (diaMatch && dentroDoHorario) { blocoEncontrado = true; indiceParaRodar = i; break; }
      }
    }
  }

  if (blocoEncontrado) {
    const b = blocos[indiceParaRodar];
    if (!b._agendadoRodando) {
      if (sistemaIniciado && idxBloco !== indiceParaRodar && !blocos[idxBloco]._agendadoRodando) {
        if (blocos[idxBloco].tipo === 'youtube' && ytUltimoPlayTimestamp > 0) {
          const decorrido = (Date.now() - ytUltimoPlayTimestamp) / 1000;
          ytTempoSalvo += Math.floor(decorrido);
          ytUltimoPlayTimestamp = 0;
        }
        blocoAnteriorIdx = idxBloco; blocoAnteriorProgresso = video.currentTime; blocoAnteriorPaused = video.paused;
      }
      blocos.forEach(bl => bl._agendadoRodando = false);
      b._agendadoRodando = true; idxBloco = indiceParaRodar; sistemaIniciado = true; tocarAtual();
    }
  } else {
    const agendadoQueEstavaRodando = blocos.find(b => b._agendadoRodando);
    if (agendadoQueEstavaRodando) {
      agendadoQueEstavaRodando._agendadoRodando = false;
      if (blocoAnteriorIdx !== -1) {
        idxBloco = blocoAnteriorIdx; blocoAnteriorIdx = -1; 
        video.style.opacity = '0'; video.style.backgroundColor = '#000000';
        tocarAtual();
        if (blocos[idxBloco] && blocos[idxBloco].tipo !== 'youtube') {
          if (blocos[idxBloco].arquivos && blocos[idxBloco].arquivos[blocos[idxBloco].arquivoAtual]) {
            video.currentTime = blocoAnteriorProgresso;
            if (blocoAnteriorPaused) video.pause();
          }
        }
      } else { window.proximoBloco(); }
    }
  }
}

function tocarAtual() {
  if (!anyPlayableBlocks()) return;
  const b = blocos[idxBloco]; 
  if (!b || b.removido) { pularParaProximo(); return; }

  const agora = new Date();
  const hoje = ["domingo", "segunda", "terca", "quarta", "quinta", "sexta", "sabado"][agora.getDay()];
  const horaAgora = agora.toTimeString().split(' ')[0];

  if (b.tipo === 'timer') {
    const diaMatch = (!b.diasSelecionados || b.diasSelecionados.length === 0 || b.diasSelecionados.includes(hoje));
    const horarioMatch = b.horarios && b.horarios.some(h => horaAgora >= h.inicio && h.fim > horaAgora);
    if (!diaMatch || !horarioMatch) { pularParaProximo(); return; }
  }
  if (b.tipo === 'youtube') {
    let diaMatchAdmin = false;
    if (Array.isArray(b.diaSemana)) { diaMatchAdmin = b.diaSemana.length === 0 || b.diaSemana.includes(hoje); } 
    else { diaMatchAdmin = (b.diaSemana === "" || (typeof b.diaSemana === 'string' && b.diaSemana.toLowerCase() === hoje)); }
    const dentroDoHorarioAdmin = (horaAgora >= b.horaInicio && horaAgora < b.horaFim);
    if (!diaMatchAdmin || !dentroDoHorarioAdmin) { pularParaProximo(); return; }
  }

  document.querySelectorAll('.bloco').forEach(el => el.classList.remove('running'));
  clearTimeout(pauseTimer); detachTimers(); 
  
  if (b.tipo !== 'youtube') {
    stopM3U(); stopYouTube();
    ytplayer.style.display = 'none'; video.style.display = 'block';
  }

  const card = document.getElementById(`bloco-${idxBloco}`); 
  if (card) card.classList.add('running');

  if (b.tipo === 'pause') { video.pause(); pauseTimer = setTimeout(() => window.proximoBloco(), b.tempo * 1000); return; }
  
  if (b.tipo === 'youtube') { 
      document.getElementById('letreiro-kbs-auto').style.display = 'none';
      if (b.ytlink) startYouTubeNow(b); 
      else if (b.m3ulink) startM3UNow(b); 
      return; 
  }
  
  if (b.arquivos.length === 0) { pularParaProximo(); return; }

  video.style.opacity = '0';
  video.style.backgroundColor = '#000000';

  const novaUrl = b.arquivos[b.arquivoAtual].url;
  if (video.src !== novaUrl) { 
      video.src = novaUrl; 
  } else {
      video.load();
  }
  
  const tempoAlvo = b.progresso[b.arquivoAtual] || 0;
  video.currentTime = tempoAlvo;
  if (tempoAlvo === 0) { video.style.opacity = '1'; }
  video.play().catch(() => {});
  attachHandlersFor(b); 
  
  gerenciarBannerKBS();
  gerenciarAseguir();
}

function pularParaProximo() { idxBloco = (idxBloco + 1) % blocos.length; setTimeout(() => { tocarAtual(); }, 0); }

function attachHandlersFor(b){
  detachTimers();
  video.onseeked = () => { video.style.opacity = '1'; };
  video.onplaying = () => { if (video.currentTime > 0) { video.style.opacity = '1'; } };

  if (b.tipo === 'timer') {
    let start = video.currentTime;
    timeupdateHandler = () => { if (video.currentTime - start >= b.tempo) { proximoArquivoMesmoBloco(); } };
    video.addEventListener('timeupdate', timeupdateHandler);
  }
  
  video.onended = () => {
    b.arquivoAtual = (b.arquivoAtual + 1) % b.arquivos.length;
    if (b.tipo === 'movie') { 
      b._count = (b._count || 0) + 1; atualizarInfoTempo(idxBloco); 
      if (b._count >= b.limitePorCiclo) { b._count = 0; window.proximoBloco(); return; } 
    } 
    tocarAtual();
  };
}

function obterDuracao(url) {
  return new Promise((resolve) => {
    const tempVid = document.createElement('video');
    tempVid.onloadedmetadata = () => { resolve(tempVid.duration); tempVid.removeAttribute('src'); tempVid.load(); };
    tempVid.onerror = () => { resolve(0); };
    tempVid.src = url;
  });
}

window.atualizarInfoTempo = function(i) {
  const b = blocos[i];
  if (!b || !b.arquivos) return;
  let infoText = b.arquivos.length + " arquivos.";
  
  if (b.tipo === 'movie') {
    let limite = b.limitePorCiclo || 3;
    let start = b.arquivoAtual || 0;
    let sum = 0; let count = 0;
    for(let j=0; j < b.arquivos.length && count < limite; j++) {
       let idx = (start + j) % b.arquivos.length; sum += (b.arquivos[idx].duration || 0); count++;
    }
    infoText += "<br><span style='color:#ffd700; font-size:11px;'>Tempo p/ rodar os " + count + ": " + fmt(sum) + "</span>";
  } else if (b.tipo === 'timer') {
    let sum = b.arquivos.reduce((a, c) => a + (c.duration || 0), 0);
    infoText += "<br><span style='color:#ffd700; font-size:11px;'>Duração total da pasta: " + fmt(sum) + "</span>";
  }
  const infoEl = document.getElementById(`info-${i}`);
  if(infoEl) infoEl.innerHTML = infoText;
}

window.carregarArquivos = async function(i, fileList){
  const validExtensions = ['.mp4', '.webm', '.ogg', '.mkv', '.mov'];
  const files = Array.from(fileList).filter(f => validExtensions.some(ext => f.name.toLowerCase().endsWith(ext)));
  blocos[i].arquivos = files.map(f => ({ url: URL.createObjectURL(f), file: f, duration: 0 }));
  blocos[i].progresso = blocos[i].arquivos.map(()=>0);
  document.getElementById(`info-${i}`).innerHTML = files.length + " arquivos. <br><span style='color:#ffd700; font-size:11px;'>Calculando tempos...</span>";
  atualizarGrade();

  for (let j = 0; j < blocos[i].arquivos.length; j++) {
     try { blocos[i].arquivos[j].duration = await obterDuracao(blocos[i].arquivos[j].url); } 
     catch(e) { blocos[i].arquivos[j].duration = 0; }
  }
  atualizarInfoTempo(i);
}

window.definirTempo = function(i,v){ blocos[i].tempo=timeToSec(v); atualizarGrade(); }
window.definirLimite = function(i,v){ blocos[i].limitePorCiclo=parseInt(v); atualizarInfoTempo(i); atualizarGrade(); }
window.pularArquivo = function(i){ const b=blocos[i]; if(b.arquivos.length>0){ b.arquivoAtual=(b.arquivoAtual+1)%b.arquivos.length; atualizarInfoTempo(i); if(idxBloco===i) tocarAtual(); } }
window.voltarArquivo = function(i){ const b=blocos[i]; if(b.arquivos.length>0){ b.arquivoAtual=(b.arquivoAtual-1+b.arquivos.length)%b.arquivos.length; atualizarInfoTempo(i); if(idxBloco===i) tocarAtual(); } }

// FUNÇÃO DE REMOVER BLOCO AJUSTADA PARA NÃO REINICIAR DO ZERO
window.removerBloco = function(i){ 
  blocos[i].removido = true; 
  document.getElementById(`bloco-${i}`).remove(); 

  if (idxBloco === i) {
    window.proximoBloco();
  } else if (idxBloco > i) {
    idxBloco--;
  }
  
  atualizarGrade();
}

window.iniciar = function(){ sistemaIniciado = true; idxBloco=0; ytTempoSalvo = 0; ytUltimoPlayTimestamp = 0; tocarAtual(); }
window.proximoBloco = function(){ idxBloco=(idxBloco+1)%blocos.length; tocarAtual(); }
window.pausar = function(){ video.pause(); }
window.retomar = function(){ video.play(); }

function startYouTubeNow(b) {
    if (video) { video.pause(); }
    ytplayer.style.display = 'block'; video.style.display = 'none'; 
    const id = b.ytlink.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/))([A-Za-z0-9_-]{11})/); 
    if(id) {
       let startParam = ytTempoSalvo > 0 ? `&start=${Math.floor(ytTempoSalvo)}` : '';
       ytplayer.src = `https://www.youtube.com/embed/${id[1]}?autoplay=1${startParam}`;
       ytUltimoPlayTimestamp = Date.now();
    }
}

function stopYouTube(){ 
    if (ytUltimoPlayTimestamp > 0) {
        const decorrido = (Date.now() - ytUltimoPlayTimestamp) / 1000;
        ytTempoSalvo += Math.floor(decorrido); ytUltimoPlayTimestamp = 0;
    }
    ytplayer.src=''; ytplayer.style.display='none'; 
}

function startM3UNow(b) {
    video.style.display = 'block';
    if (Hls.isSupported()) {
        if (hlsInstance) stopM3U();
        hlsInstance = new Hls({ enableWorker: true, lowLatencyMode: true, manifestLoadingMaxRetry: 10, levelLoadingMaxRetry: 10 });
        hlsInstance.loadSource(b.m3ulink); hlsInstance.attachMedia(video);
        hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => { video.play().catch(() => {}); });
        hlsInstance.on(Hls.Events.ERROR, function (event, data) {
            if (data.fatal) {
                switch (data.type) {
                    case Hls.ErrorTypes.NETWORK_ERROR: hlsInstance.startLoad(); break;
                    case Hls.ErrorTypes.MEDIA_ERROR: hlsInstance.recoverMediaError(); break;
                    default: stopM3U(); window.proximoBloco(); break;
                }
            }
        });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = b.m3ulink; video.addEventListener('loadedmetadata', () => video.play());
    }
}

function stopM3U() { if (hlsInstance) { hlsInstance.detachMedia(); hlsInstance.destroy(); hlsInstance = null; } video.pause(); video.removeAttribute('src'); video.load(); }
function detachTimers(){ if(timeupdateHandler) video.removeEventListener('timeupdate', timeupdateHandler); video.onended=null; }
function proximoArquivoMesmoBloco(){ 
  const b=blocos[idxBloco]; b.arquivoAtual=(b.arquivoAtual+1)%b.arquivos.length; 
  if(b.tipo === 'timer') atualizarInfoTempo(idxBloco);
  tocarAtual(); 
}

window.resizePlayer = function(){ const w=document.getElementById('playerWidth').value, h=document.getElementById('playerHeight').value; video.style.width=w+'px'; video.style.height=h+'px'; ytplayer.style.width=w+'px'; ytplayer.style.height=h+'px'; }

window.salvarProgramacao = function(){ 
  const posicoes = {};
  document.querySelectorAll('.movel, #letreiro-kbs-auto, #letreiro-aseguir, #banner-somente-logo').forEach(el => {
    if(el.id) { 
      posicoes[el.id] = { 
        top: el.style.top,

        height: el.style.height
      }; 
    }
  });
  posicoes['player-size'] = { width: document.getElementById('playerWidth').value, height: document.getElementById('playerHeight').value };

  localStorage.setItem('kbs_layout', JSON.stringify(posicoes));

  const exportData = { blocos: blocos, layout: posicoes };
  const blob = new Blob([JSON.stringify(exportData)], {type:"application/json"});

window.carregarProgramacao = function(input){ 
  const reader = new FileReader(); 
  reader.onload = e => { 
    const data = JSON.parse(e.target.result); 
    
    if (Array.isArray(data)) {
        blocos = data;
    } else {
        blocos = data.blocos || [];
        if (data.layout) {
            window.aplicarLayout(data.layout);
            localStorage.setItem('kbs_layout', JSON.stringify(data.layout));
        }
    }
    
    blocosEl.innerHTML=""; 
    blocos.forEach((b,i)=>renderizarBloco(i,b)); 
    atualizarGrade(); 
  }; 
  reader.readAsText(input.files[0]); 
}

window.blocoAnterior = function(){ idxBloco=(idxBloco-1+blocos.length)%blocos.length; tocarAtual(); }

function atualizarGrade(){ gradeEl.textContent = blocos.filter(b=>!b.removido).map((b,i)=>`Bloco ${i+1}${b.nome ? ' ('+b.nome+')' : ''}: ${b.tipo} ${b.horaInicio?'('+b.horaInicio+')':''}`).join('\n'); }

window.toggleDia = function(i, dia) { if (!blocos[i].diasSelecionados) blocos[i].diasSelecionados = []; const idx = blocos[i].diasSelecionados.indexOf(dia); if (idx === -1) blocos[i].diasSelecionados.push(dia); else blocos[i].diasSelecionados.splice(idx, 1); }
window.addHora = function(i) { if (!blocos[i].horarios) blocos[i].horarios = []; blocos[i].horarios.push({ inicio: "00:00:00", fim: "00:00:00" }); const container = document.getElementById(`lista-horarios-${i}`); const div = document.createElement('div'); const idx = blocos[i].horarios.length - 1; div.style = "display:flex; gap:5px; margin-bottom:5px;"; div.innerHTML = `<input type="time" step="1" value="00:00:00" oninput="editHora(${i}, ${idx}, 'inicio', this.value)" style="width:85px;"><input type="time" step="1" value="00:00:00" oninput="editHora(${i}, ${idx}, 'fim', this.value)" style="width:85px;"><button onclick="removeHora(${i}, ${idx})" style="background:#b71c1c; padding:2px 5px; border-radius:4px;">X</button>`; container.appendChild(div); }
window.editHora = function(i, idx, campo, valor) { blocos[i].horarios[idx][campo] = valor; }
window.removeHora = function(i, idx) { blocos[i].horarios.splice(idx, 1); const container = document.getElementById(`lista-horarios-${i}`); container.innerHTML = blocos[i].horarios.map((h, subIdx) => `<div style="display:flex; gap:5px; margin-bottom:5px;"><input type="time" step="1" value="${h.inicio}" oninput="editHora(${i}, ${subIdx}, 'inicio', this.value)" style="width:85px;"><input type="time" step="1" value="${h.fim}" oninput="editHora(${i}, ${subIdx}, 'fim', this.value)" style="width:85px;"><button onclick="removeHora(${i}, ${subIdx})" style="background:#b71c1c; padding:2px 5px; border-radius:4px;">X</button></div>`).join(''); }

let isDragging = false; let offsetX, offsetY; let activeElement = null;

window.startDrag = function(e) { 
    isDragging = true; activeElement = e.currentTarget;
    offsetX = e.clientX - activeElement.getBoundingClientRect().left; 
    offsetY = e.clientY - activeElement.getBoundingClientRect().top; 
    document.addEventListener('mousemove', onDrag); 
    document.addEventListener('mouseup', stopDrag); 
};
function onDrag(e) { 
    if (!isDragging || !activeElement) return; 
    const container = activeElement.parentElement.getBoundingClientRect(); 
    let x = e.clientX - container.left - offsetX; let y = e.clientY - container.top - offsetY; 
    activeElement.style.left = x + 'px'; activeElement.style.top = y + 'px'; 
}
function stopDrag() { 
    isDragging = false; 
    activeElement = null; 
    document.removeEventListener('mousemove', onDrag); 
    document.removeEventListener('mouseup', stopDrag);
}

let mediaRecorder; let socket;

window.toggleStream = async function() {
    const btn = document.getElementById('btnStream'); const led = document.getElementById('statusLed'); const url = document.getElementById('bridgeUrl').value; const playerEl = document.getElementById('player');
    if (!mediaRecorder || mediaRecorder.state === "inactive") {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: "browser", frameRate: 20 }, audio: true, preferCurrentTab: true });
            if (!!window.CropTarget) { const target = await CropTarget.fromElement(playerEl); const [videoTrack] = stream.getVideoTracks(); await videoTrack.cropTo(target); }
            socket = new WebSocket(url);
            socket.onopen = () => {
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm; codecs=vp8,opus', videoBitsPerSecond: 450000 });
                mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0 && socket.readyState === WebSocket.OPEN) { socket.send(e.data); } };
                mediaRecorder.start(100); 
                btn.innerText = "⏹ PARAR TRANSMISSÃO"; btn.style.background = "#2e7d32"; led.style.background = "#00ff00";
            };
            socket.onclose = () => resetStreamUI(btn, led);
            socket.onerror = () => { alert("Erro de conexão."); resetStreamUI(btn, led); };
            stream.getVideoTracks()[0].onended = () => { if(mediaRecorder) mediaRecorder.stop(); if(socket) socket.close(); resetStreamUI(btn, led); };
        } catch (err) { console.error(err); alert("Erro: Certifique-se de escolher 'Separador do Chrome' e a aba deste player."); }
    } else { mediaRecorder.stop(); if(socket) socket.close(); resetStreamUI(btn, led); }
};
function resetStreamUI(btn, led) { btn.innerText = "🔴 INICIAR TRANSMISSÃO"; btn.style.background = "#b71c1c"; led.style.background = "#444"; }

let layoutTravado = true;
const btnTrava = document.createElement('button'); btnTrava.id = 'btn-trava-layout'; btnTrava.innerHTML = '🔒 Layout Travado'; btnTrava.className = 'layout-travado'; document.body.appendChild(btnTrava);

btnTrava.onclick = () => {
  layoutTravado = !layoutTravado;
  if (layoutTravado) { btnTrava.innerHTML = '🔒 Layout Travado'; btnTrava.className = 'layout-travado'; document.body.classList.remove('modo-edicao'); } 
  else { btnTrava.innerHTML = '🔓 Layout Livre'; btnTrava.className = 'layout-destravado'; document.body.classList.add('modo-edicao'); }
};

document.addEventListener('mousedown', (e) => {
  if (layoutTravado) return;
  const target = e.target.closest('.movel');
  if (!target || e.target.tagName === 'BUTTON' || e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

  const rect = target.getBoundingClientRect();
  const isBottomRight = (e.clientX > rect.right - 20) && (e.clientY > rect.bottom - 20);
  if (target.classList.contains('redimensionavel') && isBottomRight) {
     return; 
  }

  let shiftX = e.clientX - target.getBoundingClientRect().left; 
  let shiftY = e.clientY - target.getBoundingClientRect().top;

  function moveAt(pageX, pageY) { 
      target.style.left = pageX - shiftX + 'px'; 
      target.style.top = pageY - shiftY + 'px'; 
  }

  function onMouseMove(event) { 
      moveAt(event.pageX, event.pageY); 
  }

  function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
  }

  document.addEventListener('mousemove', onMouseMove);
  document.addEventListener('mouseup', onMouseUp);
});
document.addEventListener('dragstart', (e) => { if (e.target.closest('.movel')) e.preventDefault(); });

const player = document.getElementById('player');
function limparPlayer() { if (player) { player.controls = false; const shadow = player.shadowRoot; if (shadow) { const loading = shadow.querySelector('.media-loading-indicator'); if (loading) loading.style.display = 'none'; } } }
setInterval(limparPlayer, 500);

let _ultimoBlocoAtivo = -1;
let _tempoFimPausa = 0;

setInterval(() => {
    if (!sistemaIniciado || blocos.length === 0) return;
    
    const b = blocos[idxBloco];
    if (!b || b.removido) return;
    
    document.querySelectorAll('.contador-regressivo').forEach(el => el.innerHTML = '');
    
    const contadorEl = document.getElementById(`countdown-${idxBloco}`);
    if (!contadorEl) return;
    
    let segundosRestantes = 0;
    let mostrar = false;
    
    if (b.tipo === 'pause') {
        if (_ultimoBlocoAtivo !== idxBloco) {
            _tempoFimPausa = Date.now() + (b.tempo * 1000);
        }
        segundosRestantes = Math.max(0, (_tempoFimPausa - Date.now()) / 1000);
        mostrar = true;
    } 
    else if (b.tipo === 'movie' && b.arquivos && b.arquivos.length > 0) {
        let restanteAtual = Math.max(0, video.duration - video.currentTime) || 0;
        
        let sumOutros = 0;
        let limite = b.limitePorCiclo || 3;
        let countAtual = b._count || 0;
        let start = (b.arquivoAtual + 1) % b.arquivos.length;
        
        for (let j = 0; j < limite - countAtual - 1; j++) {
            let idx = (start + j) % b.arquivos.length;
            if (b.arquivos[idx]) sumOutros += (b.arquivos[idx].duration || 0);
        }
        
        segundosRestantes = restanteAtual + sumOutros;
        mostrar = true;
    } 
    else if (b.tipo === 'timer' && b.arquivos && b.arquivos.length > 0) {
        segundosRestantes = Math.max(0, b.tempo - video.currentTime);
        mostrar = true;
    }

    if (mostrar && segundosRestantes > 0) {
        contadorEl.innerHTML = `⏳ Faltam <span style="color:#ff4d4d; font-weight:900; font-size:12px;">${fmt(segundosRestantes)}</span> para o próximo bloco`;
    }
    
    _ultimoBlocoAtivo = idxBloco;
}, 1000);

setInterval(() => {
    if (!sistemaIniciado || blocos.length === 0) return;
    const b = blocos[idxBloco];
    if (b && (b.tipo === 'movie' || b.tipo === 'timer') && b.arquivos && b.arquivos.length > 0) {
        atualizarInfoTempo(idxBloco);
    }
}, 60000);
</script>
